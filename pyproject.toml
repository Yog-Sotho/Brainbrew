[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brainbrew"
version = "2.0.0"
description = "No-code synthetic LLM training dataset generator"
readme = "README.md"
license = "MIT"
# vLLM supports Python 3.10–3.13; keep the upper bound so the universal lock resolves.
requires-python = ">=3.12,<3.14"
authors = [
    {name = "YogSotho"},
]
keywords = [
    "llm", "synthetic-data", "dataset", "distillation", "training-data",
    "machine-learning", "ai", "vllm", "lora", "peft",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core = OpenAI-API mode. Runs on any OS, no GPU required.
# Lower bounds are the first releases without known advisories (pip-audit, 2026-10).
dependencies = [
    "streamlit[auth]>=1.54.0,<2",
    "pydantic>=2.12.0,<3",
    "python-dotenv>=1.2.2",
    "structlog>=25.1.0",
    "pdfminer.six>=20251107",
    "langchain-text-splitters>=1.1.2,<2",
    "openai>=3.24.0,<4",
    "tenacity>=9.1.4",
    "numpy>=2.0",
    "xxhash>=3.5",
    "datasets>=3.4.1",
    "huggingface-hub>=0.34.0",
    "typer>=0.27.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Local GPU inference server: provides `vllm serve`, an OpenAI-compatible endpoint
# Brainbrew talks to like any other (see README, compose.yaml).
vllm = [
    "vllm>=0.30.0; sys_platform == 'linux'",
]
# Local LoRA fine-tuning (TRL + PEFT; 4-bit QLoRA via bitsandbytes on CUDA).
train = [
    "torch>=2.6",
    "transformers>=5.10.4",
    "trl>=1.14.1",
    "peft>=0.21.2",
    "accelerate>=1.15.0",
    "datasets>=4.7.0",
    "bitsandbytes>=0.50.2; sys_platform == 'linux'",
]
# Optional NER-based PII detection (names, passport/licence numbers, ...) on
# top of the built-in detectors. Also needs a spaCy model:
#   python -m spacy download en_core_web_lg
pii = [
    "presidio-analyzer>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.13",
    "mypy>=1.18",
]

[project.urls]
Homepage = "https://github.com/Yog-Sotho/Brainbrew"
Repository = "https://github.com/Yog-Sotho/Brainbrew"
Issues = "https://github.com/Yog-Sotho/Brainbrew/issues"

# ── setuptools (flat layout) ─────────────────────────────────────────────────

[project.scripts]
brainbrew = "cli:main"

[tool.setuptools]
py-modules = ["app", "cli", "config", "orchestrator"]
packages = ["engine", "pipeline", "publish", "training", "ui"]

# ── uv ───────────────────────────────────────────────────────────────────────


# ── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ── coverage ─────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "old/*", ".venv/*", "bench/make_fixtures.py"]

# ── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "xxhash.*",
    "presidio_analyzer.*",
    "yaml.*",
    "peft.*",
    "torch.*",
    "trl.*",
    "transformers.*",
    "datasets.*",
    "pdfminer.*",
]
ignore_missing_imports = true

# ── ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["old"]

[tool.ruff.lint]
# S: bandit security checks; PT: pytest style; RUF: ruff's own checks.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "PT", "RUF"]
ignore = [
    "E501",
    "PT018",  # composite asserts (`assert a and b`) read fine in these tests
]
# En dashes are deliberate typography in UI text and dataset cards.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fake credentials and start child processes on purpose.
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603"]
"bench/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["cli", "config", "orchestrator", "engine", "pipeline", "publish", "training", "ui"]
