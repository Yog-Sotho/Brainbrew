version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    # requirements*.txt are exported from uv.lock with hashes. Dependabot's uv updater
    # treats them as compiled files, fails to recompute their hashes (it builds index
    # URLs like '/pypi/numpy/json') and then opens no pull request at all. It updates
    # pyproject.toml and uv.lock only; regenerate the exports on the PR branch:
    #   uv export --frozen --no-dev --no-emit-project [--extra train] -o requirements*.txt
    # (CI's `lockfile` job fails until they match).
    exclude-paths:
      - "requirements.txt"
      - "requirements-train.txt"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
