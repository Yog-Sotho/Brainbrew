version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    # After merging a uv update, regenerate the exported files:
    #   uv export --frozen --no-dev --no-emit-project [--extra vllm|train] -o requirements*.txt
    # (CI's `lockfile` job fails until they match).

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
