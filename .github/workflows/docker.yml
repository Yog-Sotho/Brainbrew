name: Docker

# The release publishes the CPU (`api`) image for linux/amd64 and linux/arm64.
# ci.yml builds, smoke-tests and scans the amd64 image on every pull request;
# this builds the arm64 one natively (without pushing) and smoke-tests it when
# the image or its inputs change.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docker.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image (arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          platforms: linux/arm64
          push: false
          load: true
          tags: brainbrew-api:ci
      - name: Smoke test container
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 127.0.0.1:8501:8501 brainbrew-api:ci)
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8501/_stcore/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8501/_stcore/health
          test "$(docker exec "$cid" id -u)" = "10001"
          docker rm -f "$cid"
