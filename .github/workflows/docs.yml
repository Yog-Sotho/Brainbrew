name: Docs

# Publishes the documentation site to GitHub Pages from main:
# https://yog-sotho.github.io/Brainbrew/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Pull requests are covered by CI's `docs` job, which runs the same strict build.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a deployment midway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"

# Actions are pinned to full commit SHAs (tag in the trailing comment);
# Dependabot keeps them current.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build the docs site (fails on broken links)
        run: uv run --locked --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
