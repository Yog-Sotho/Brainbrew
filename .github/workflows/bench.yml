name: Benchmark

# Generation-quality benchmark (bench/run_bench.py) on the fixed corpus in
# tests/fixtures/bench/, nightly and on demand.
#
# Pick the model provider with the BENCH_PROVIDER repository variable (or the
# "provider" input of a manual run):
#   openai  (default) secret OPENAI_API_KEY, model gpt-4o-mini
#   gemini  secret GEMINI_API_KEY (free tier from Google AI Studio), model
#           gemini-3.8-flash with minimal thinking. Free-tier requests may be used by
#           Google to improve its products; the corpus is public domain.
#   custom  any OpenAI-compatible endpoint: variable BENCH_BASE_URL, variable
#           BENCH_MODEL, optional secret BENCH_API_KEY
# Optional variables: BENCH_MODEL (overrides the provider's model) and
# BENCH_CONCURRENCY (parallel requests; lower it for tight free-tier limits).
# Without the provider's key the job is skipped with a notice.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Model provider (default: the BENCH_PROVIDER variable, else openai)"
        type: choice
        options: [default, openai, gemini, custom]
        default: default
      model:
        description: "Teacher model (default: BENCH_MODEL, else the provider's default)"
        required: false
      scale:
        description: "Multiply every target (1.0 = full benchmark)"
        required: false
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A defined BENCH_BASE_URL without BENCH_PROVIDER keeps meaning "custom endpoint".
      BENCH_PROVIDER: ${{ (inputs.provider != '' && inputs.provider != 'default') && inputs.provider || vars.BENCH_PROVIDER || (vars.BENCH_BASE_URL != '' && 'custom') || 'openai' }}
      BENCH_MODEL: ${{ inputs.model || vars.BENCH_MODEL }}
      BENCH_SCALE: ${{ inputs.scale || '1.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      # Resolves the provider into its endpoint, model, key and limits. Only the
      # name of the key's secret leaves this step, never the key.
      - name: Choose the provider
        id: setup
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BENCH_API_KEY: ${{ secrets.BENCH_API_KEY }}
          BENCH_BASE_URL: ${{ vars.BENCH_BASE_URL }}
          BENCH_CONCURRENCY: ${{ vars.BENCH_CONCURRENCY }}
        run: |
          set -euo pipefail
          effort=""
          case "$BENCH_PROVIDER" in
            openai) base="https://api.openai.com/v1"; model="gpt-4o-mini"; key_var=OPENAI_API_KEY
                    concurrency=8; key_page="https://platform.openai.com/api-keys" ;;
            gemini) base="https://generativelanguage.googleapis.com/v1beta/openai"; model="gemini-3.8-flash"
                    key_var=GEMINI_API_KEY; concurrency=2
                    key_page="https://aistudio.google.com/apikey" ;;
            custom) base="$BENCH_BASE_URL"; model=""; key_var=BENCH_API_KEY; concurrency=4; key_page=""
                    if [ -z "$base" ]; then
                      echo "::error title=No endpoint::The custom provider needs the BENCH_BASE_URL repository variable."
                      exit 1
                    fi ;;
            *) echo "::error title=Unknown provider::BENCH_PROVIDER is '$BENCH_PROVIDER'; use openai, gemini or custom."
               exit 1 ;;
          esac
          model="${BENCH_MODEL:-$model}"
          # Gemini 2.5 can turn thinking off; Gemini 3 and later only go down to "minimal".
          if [ "$BENCH_PROVIDER" = gemini ]; then
            case "$model" in gemini-2.5*) effort="none" ;; *) effort="minimal" ;; esac
          fi
          if [ -z "$model" ]; then
            echo "::error title=No model::Set the BENCH_MODEL repository variable or the workflow's model input."
            exit 1
          fi
          present=true
          if [ -z "${!key_var}" ] && [ "$BENCH_PROVIDER" != custom ]; then
            echo "::notice::The $key_var secret is not set; skipping the $BENCH_PROVIDER benchmark."
            present=false
          fi
          {
            echo "present=$present"
            echo "base=$base"
            echo "model=$model"
            echo "key_var=$key_var"
            echo "key_page=$key_page"
            echo "concurrency=${BENCH_CONCURRENCY:-$concurrency}"
            echo "effort=$effort"
          } >> "$GITHUB_OUTPUT"
          echo "Provider $BENCH_PROVIDER: $model at $base, ${BENCH_CONCURRENCY:-$concurrency} parallel requests."
      # One tiny request before the benchmark (a few tokens), so a bad key, model
      # name or empty account gives one clear error instead of a report full of
      # failed documents.
      - name: Check that the provider accepts the key, the model and the account
        if: steps.setup.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BENCH_API_KEY: ${{ secrets.BENCH_API_KEY }}
          BASE: ${{ steps.setup.outputs.base }}
          MODEL: ${{ steps.setup.outputs.model }}
          KEY_VAR: ${{ steps.setup.outputs.key_var }}
          KEY_PAGE: ${{ steps.setup.outputs.key_page }}
          EFFORT: ${{ steps.setup.outputs.effort }}
        run: |
          set -euo pipefail
          key="${!KEY_VAR}"
          model="${MODEL%%,*}"
          model="${model// /}"
          body=$(mktemp)
          request=$(jq -n --arg m "$model" --arg e "$EFFORT" \
            '{model: $m, messages: [{role: "user", content: "ok"}], max_tokens: 5}
             + (if $e == "" then {} else {reasoning_effort: $e} end)')
          auth=()
          if [ -n "$key" ]; then auth=(-H "Authorization: Bearer $key"); fi
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 60 "${BASE%/}/chat/completions" \
            "${auth[@]}" -H "Content-Type: application/json" -d "$request")
          message=$(jq -r '(if type == "array" then .[0] else . end) | .error.message? // empty' "$body" 2>/dev/null | head -c 400 || true)
          if [ -n "$message" ]; then echo "Provider said ($code): $message"; fi
          replace="Create a new key${KEY_PAGE:+ at $KEY_PAGE} and replace the $KEY_VAR repository secret with the key alone (no quotes, spaces or line breaks)."
          case "$code" in
            200) echo "$BENCH_PROVIDER accepts the key and serves $model." ;;
            401) echo "::error title=$KEY_VAR rejected::The provider answered 401 (invalid API key). $replace"
                 exit 1 ;;
            400) if grep -qiE 'api[ _]?key' "$body"; then
                   echo "::error title=$KEY_VAR rejected::The provider says the API key is not valid. $replace"
                   exit 1
                 fi
                 echo "::warning::The provider answered 400 to the key check; running the benchmark anyway."
                 head -c 500 "$body"; echo ;;
            403) echo "::error title=No access::The provider answered 403: this key has no access to $model."
                 exit 1 ;;
            404) echo "::error title=Unknown model::The provider does not serve '$model' to this key. Check BENCH_MODEL or the workflow's model input."
                 echo "Models this key can use:"
                 curl -sS --max-time 30 "${BASE%/}/models" "${auth[@]}" \
                   | jq -r '.data[]?.id' 2>/dev/null | sed 's|^models/||' | sort | head -n 80 || true
                 exit 1 ;;
            429) if grep -qE 'insufficient_quota|credit_balance|billing' "$body"; then
                   echo "::error title=No credits::The account behind $KEY_VAR has no credits left. Add credits with the provider, or switch to a free provider (BENCH_PROVIDER=gemini)."
                   exit 1
                 fi
                 echo "::warning::The provider is rate limiting this key; running the benchmark anyway." ;;
            *) echo "::warning::The provider answered HTTP $code to the key check; running the benchmark anyway." ;;
          esac
      - name: Run benchmark
        if: steps.setup.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BENCH_API_KEY: ${{ secrets.BENCH_API_KEY }}
          BASE: ${{ steps.setup.outputs.base }}
          MODEL: ${{ steps.setup.outputs.model }}
          KEY_VAR: ${{ steps.setup.outputs.key_var }}
          CONCURRENCY: ${{ steps.setup.outputs.concurrency }}
          EFFORT: ${{ steps.setup.outputs.effort }}
          BRAINBREW_RUNS_DIR: ${{ runner.temp }}/runs
        run: |
          set -euo pipefail
          # run_bench reads the endpoint's key from OPENAI_API_KEY; hand it only the
          # chosen provider's key.
          key="${!KEY_VAR}"
          unset GEMINI_API_KEY BENCH_API_KEY
          export OPENAI_API_KEY="$key"
          args=(--model "$MODEL" --base-url "$BASE" --concurrency "$CONCURRENCY" --scale "$BENCH_SCALE"
                --out bench-report.json)
          if [ -n "$EFFORT" ]; then args+=(--reasoning-effort "$EFFORT"); fi
          uv run --locked python bench/run_bench.py "${args[@]}"
      - name: Print report
        if: always() && steps.setup.outputs.present == 'true'
        run: cat bench-report.json 2>/dev/null || true
