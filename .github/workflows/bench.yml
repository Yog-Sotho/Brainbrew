name: Benchmark

# Nightly generation-quality benchmark (bench/run_bench.py) on the fixed corpus
# in tests/fixtures/bench/ with a cheap model. Needs the OPENAI_API_KEY secret;
# without it the job is skipped with a notice. Optional repository variables:
# BENCH_MODEL (default gpt-4o-mini) and BENCH_BASE_URL (another
# OpenAI-compatible endpoint).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Teacher model (default: BENCH_MODEL or gpt-4o-mini)"
        required: false
      scale:
        description: "Multiply every target (1.0 = full benchmark)"
        required: false
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCH_MODEL: ${{ inputs.model || vars.BENCH_MODEL || 'gpt-4o-mini' }}
      BENCH_SCALE: ${{ inputs.scale || '1.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Check for an API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OPENAI_API_KEY secret is not set; skipping the benchmark."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # One tiny request before the benchmark (a 1-token completion, a fraction of a
      # cent), so a bad key, model name or empty account gives one clear error
      # instead of a report full of failed documents.
      - name: Check that OpenAI accepts the key, the model and the account
        if: steps.key.outputs.present == 'true' && vars.BENCH_BASE_URL == ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          model="${BENCH_MODEL%%,*}"
          model="${model// /}"
          body=$(mktemp)
          request=$(jq -n --arg m "$model" \
            '{model: $m, messages: [{role: "user", content: "ok"}], max_completion_tokens: 1}')
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" -d "$request")
          case "$code" in
            200) echo "OpenAI accepts the key and the account, and serves $model." ;;
            401) echo "::error title=OPENAI_API_KEY rejected::OpenAI answered 401 (invalid API key). Create a new key at https://platform.openai.com/api-keys and replace the OPENAI_API_KEY repository secret with the key alone (no quotes, spaces or line breaks)."
                 exit 1 ;;
            403) echo "::error title=No access::OpenAI answered 403: the key's project has no access to $model."
                 exit 1 ;;
            404) echo "::error title=Unknown model::OpenAI does not serve '$model' to this key. Check BENCH_MODEL or the workflow's model input."
                 exit 1 ;;
            429) if grep -qE 'insufficient_quota|credit_balance|billing' "$body"; then
                   echo "::error title=No OpenAI credits::The OpenAI account behind OPENAI_API_KEY has no credits left. Add credits at https://platform.openai.com/settings/organization/billing and run the benchmark again."
                   exit 1
                 fi
                 echo "::warning::OpenAI is rate limiting this key; running the benchmark anyway." ;;
            *) echo "::warning::OpenAI answered HTTP $code to the key check; running the benchmark anyway." ;;
          esac
      - name: Run benchmark
        if: steps.key.outputs.present == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Empty when the variable is not defined; the engine then uses OpenAI.
          OPENAI_BASE_URL: ${{ vars.BENCH_BASE_URL }}
          BRAINBREW_RUNS_DIR: ${{ runner.temp }}/runs
        run: >-
          uv run --locked python bench/run_bench.py
          --model "$BENCH_MODEL" --scale "$BENCH_SCALE" --out bench-report.json
      - name: Print report
        if: always() && steps.key.outputs.present == 'true'
        run: cat bench-report.json 2>/dev/null || true
