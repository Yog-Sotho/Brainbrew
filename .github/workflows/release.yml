name: Release

# Push a tag `vX.Y.Z` (matching pyproject.toml) to publish a signed release:
# wheel, sdist and CycloneDX SBOMs, each signed keylessly with Sigstore using
# this workflow's GitHub OIDC identity. Verify a download with:
#   uvx sigstore verify github --cert-identity \
#     "https://github.com/Yog-Sotho/Brainbrew/.github/workflows/release.yml@refs/tags/vX.Y.Z" \
#     brainbrew-X.Y.Z-py3-none-any.whl
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"
  SIGSTORE: "sigstore==4.5.0"
  CYCLONEDX: "cyclonedx-bom==7.5.0"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Tag must match the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "v$version" || { echo "::error::tag $TAG does not match pyproject version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build wheel and sdist
        run: uv build -o dist
      - name: Collect distributions for PyPI
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: pypi-dist/
      - name: SBOMs (CycloneDX)
        run: |
          uvx --from "$CYCLONEDX" cyclonedx-py requirements requirements.txt --of JSON --validate \
            -o "dist/brainbrew-$VERSION-sbom.cdx.json"
          uvx --from "$CYCLONEDX" cyclonedx-py requirements requirements-train.txt --of JSON --validate \
            -o "dist/brainbrew-$VERSION-train-sbom.cdx.json"
      - name: Sign with Sigstore
        run: uvx "$SIGSTORE" sign dist/*
      - name: Verify the signatures
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for f in dist/*.whl dist/*.tar.gz dist/*.cdx.json; do
            uvx "$SIGSTORE" verify github --cert-identity "$IDENTITY" "$f"
          done
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "Brainbrew $VERSION" --notes-file notes.md --verify-tag

  # PyPI upload via Trusted Publishing. Independent of the signed GitHub
  # release above: a PyPI configuration problem never loses the release or
  # its tag, and re-running after a failed upload reuses the existing release.
  publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing; also uploads PEP 740 attestations
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Container image ghcr.io/<owner>/brainbrew:{version,latest}: the CPU (`api`)
  # target; the GPU target's CUDA torch stack doesn't fit on hosted runners. Each
  # architecture is built natively and pushed by digest; publish-image joins them
  # into one multi-arch image, signs it (keyless) and attaches build provenance.
  image:
    needs: release
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brainbrew" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Brainbrew
            org.opencontainers.image.description=No-code synthetic LLM training data (CPU image)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
          # Provenance is attached to the multi-arch image in publish-image.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        run: |
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  publish-image:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # Sigstore keyless signing
      attestations: write
    steps:
      - run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/brainbrew" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create the multi-arch image
        id: index
        run: |
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" \
            "${IMAGE}@$(cat digests/amd64)" "${IMAGE}@$(cat digests/arm64)"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.index.outputs.digest }}"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
